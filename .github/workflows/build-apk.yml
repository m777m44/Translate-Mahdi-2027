name: Build Android APK

on:
  workflow_dispatch: {}
  push:
    branches: [main, 'arena/**']
    paths:
      - 'android/**'
      - 'capacitor.config.ts'
      - '.github/workflows/build-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No `cache:` here — the repo gitignores package-lock.json (bun.lock is the
      # convention), and setup-node caching requires a committed lockfile.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Repo convention is bun.lock (package-lock.json is gitignored), so use
      # a plain install rather than `npm ci` (which requires a lockfile).
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web assets
        run: npm run build

      - name: Sync Capacitor (copy dist into Android shell)
        run: npx cap sync android

      - name: Setup Java (JDK 21 for AGP 8)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Ensure Android SDK platform 36 + accept licenses
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" || true

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/mahdi-translate.apk
          ls -la release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mahdi-translate-apk
          path: release/mahdi-translate.apk
          retention-days: 30
