<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#05070d">
    <title>مهدي — Mahdi Translator Pro</title>
    <meta name="description" content="تطبيق ترجمة احترافي ذكي وشامل — كشف تلقائي فوري، أكثر من 1500 ثيم، ترجمة صوتية وصور، تنزيل لغات بدون إنترنت، وتحليل لغوي دقيق">
    <meta property="og:title" content="مهدي — Mahdi Translator Pro">
    <meta property="og:description" content="ترجمة فورية تلقائية بأكثر من 1500 ثيم احترافي — صوت، صورة، محادثة مباشرة، وتحليل لغوي دقيق">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="مهدي">
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Tajawal:wght@300;400;500;700;800&family=Reem+Kufi:wght@400;500;600;700&family=Amiri:wght@400;700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&family=Orbitron:wght@400;600;800&display=swap"
      rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Neutral base — the theme engine paints the real colours on :root. */
        html, body { background-color: #05070d; margin: 0; }
        body { font-family: 'Cairo', 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        #root { min-height: 100vh; }
        .rtl { direction: rtl; }
        .ltr { direction: ltr; }
        /* Prevent the browser from painting its own white flash before the theme loads. */
        @media (prefers-color-scheme: light) { html { background-color: #f7f8fb; } }
    </style>
</head>
<body class="transition-colors duration-300">
    <div id="root"></div>
    <script>
      // Register the service worker (PWA install + offline shell).
      if ('serviceWorker' in navigator && !location.search.includes('nosw')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
