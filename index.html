<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0B2B4D">
    <title>Translate Mahdi 2027 — مهدي للترجمة 5.1</title>
    <meta name="description" content="مترجم فوري سريع بأسلوب ترجمة جوجل: نص وصوت وصور وكاميرا أونلاين وأوفلاين، نافذة عائمة قابلة للسحب، 1544 ثيم، وتثبيت على الشاشة الرئيسية">
    <meta property="og:title" content="Translate Mahdi 2027 — مهدي للترجمة 5.1">
    <meta property="og:description" content="ترجمة فورية للنص والصوت والصور في وضعي الاتصال وبدونه، مع نافذة عائمة وكاميرا OCR وتعرف صوتي أصلي على أندرويد">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="مهدي">
    <!-- Tailwind is compiled at build time (styles/tailwind.css).
         It used to be loaded from cdn.tailwindcss.com at runtime, which fails
         offline and collapsed the entire layout. Never re-add a CDN here. -->
    <style>
        /* Neutral base — the theme engine paints the real colours on :root. */
        html, body { background-color: #05070d; margin: 0; }
        body { font-family: 'Cairo', 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        #root { min-height: 100vh; }
        .rtl { direction: rtl; }
        .ltr { direction: ltr; }
        /* Prevent the browser from painting its own white flash before the theme loads. */
        @media (prefers-color-scheme: light) { html { background-color: #f7f8fb; } }
    </style>
</head>
<body class="transition-colors duration-300">
    <div id="root"></div>
    <script>
      // Register the service worker (PWA install + offline shell).
      if ('serviceWorker' in navigator && !location.search.includes('nosw')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
